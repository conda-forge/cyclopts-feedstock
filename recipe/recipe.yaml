schema_version: 1

context:
  name: cyclopts
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cyclopts-${{ version }}.tar.gz
  sha256: 8bee8822319f5cd90711f568aec54a0a02bd3571ddff45c94aa62405beed38b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - attrs >=23.1.0
    - rich >=13.6.0
    - docstring_parser >=0.15,<4.0
    - rich-rst >=2.0.1,<3

tests:
  - python:
      imports:
        - cyclopts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Intuitive, easy CLIs based on python type hints.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/BrianPugh/cyclopts
  documentation: https://cyclopts.readthedocs.io/

extra:
  recipe-maintainers:
    - thewchan
    - jbsilva
